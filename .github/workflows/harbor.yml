name: Harbor CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync locked engine environment
        run: uv sync --frozen --extra test --extra dev
      - name: Harbor JSON contract
        run: uv run --frozen pytest -q tests/test_status_json.py
      - name: Upstream tier-1 suite
        run: uv run --frozen pytest -q
      - name: Ruff
        run: uv run --frozen ruff check src/ tests/
      - name: Format
        run: uv run --frozen ruff format --check src/ tests/
      - name: Type check
        run: uv run --frozen mypy src/btrfs_backup_ng --ignore-missing-imports

  rust-control-plane:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: harbor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --exclude btrfs-harbor-desktop --locked
      - name: Clippy
        run: cargo clippy --workspace --exclude btrfs-harbor-desktop --all-targets --locked -- -D warnings

  distro-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            image: ghcr.io/archlinux/archlinux:base
            package_manager: pacman
          - name: debian
            image: public.ecr.aws/ubuntu/ubuntu:24.04
            package_manager: apt-get
          - name: fedora
            image: quay.io/fedora/fedora:43
            package_manager: dnf
          - name: opensuse
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            package_manager: zypper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Smoke universal Linux packaging
        env:
          IMAGE: ${{ matrix.image }}
          PACKAGE_MANAGER: ${{ matrix.package_manager }}
        run: |
          docker run --rm \
            -e PACKAGE_MANAGER="$PACKAGE_MANAGER" \
            -v "$PWD:/src:ro" \
            "$IMAGE" \
            /bin/bash -lc '
              command -v "$PACKAGE_MANAGER"
              bash -n /src/packaging/universal/install-payload.sh
              bash -n /src/install-linux.sh
              bash -n /src/install-cachyos.sh
              /src/packaging/universal/install-payload.sh --help | grep -q "x86_64 Linux with systemd and glibc"
            '

  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: harbor/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.9.1"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Svelte diagnostics
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Static build
        run: pnpm build

  tauri:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: harbor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev             libgtk-3-dev             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev             libdbus-1-dev
      - name: Cargo check desktop
        run: cargo check -p btrfs-harbor-desktop --locked

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate XML policies
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              "packaging/dbus/io.github.GodsQuantum.BtrfsHarbor1.conf",
              "packaging/polkit/io.github.GodsQuantum.BtrfsHarbor.policy",
          ]:
              ET.parse(path)
              print("valid:", path)
          PY
      - name: Validate packaging files
        run: |
          bash -n packaging/arch/PKGBUILD
          bash -n install-linux.sh
          bash -n install-cachyos.sh
          bash -n packaging/universal/install-payload.sh
          test -s packaging/systemd/btrfs-harbor-agent.service
          test -s packaging/desktop/btrfs-harbor.desktop
          test -s examples/harbor.toml
          test -s README.md
          test -s README.fr.md
          test -s README.zh-CN.md
          python - <<'PY'
          import json, re, tomllib
          from pathlib import Path

          workspace = tomllib.loads(Path("harbor/Cargo.toml").read_text())
          stable_version = workspace["workspace"]["package"]["version"]
          desktop = tomllib.loads(Path("harbor/desktop/src-tauri/Cargo.toml").read_text())
          desktop_version = desktop["package"]["version"]
          package = json.loads(Path("harbor/desktop/package.json").read_text())
          tauri = json.loads(Path("harbor/desktop/src-tauri/tauri.conf.json").read_text())
          pkgbuild = Path("packaging/arch/PKGBUILD").read_text()
          # The mature Rust helper and Arch stable package retain the last
          # stable version while desktop prereleases move independently.
          assert package["version"] == desktop_version, "npm/Tauri version mismatch"
          assert tauri["version"] == desktop_version, "Tauri bundle version mismatch"
          assert re.search(
              rf"^pkgver={re.escape(stable_version)}\.r0\.g0000000$",
              pkgbuild, re.M
          ), "Arch stable package version mismatch"
          for readme in ("README.md", "README.fr.md", "README.zh-CN.md"):
              text = Path(readme).read_text()
              assert (
                  f"/v{stable_version}/BTRFS-Harbor-{stable_version}-linux-x86_64.run"
                  in text
              ), f"{readme}: stale stable download link"
              if desktop_version != stable_version:
                  assert "-rc." in desktop_version, "Unexpected mixed package versions"
                  assert f"## v{desktop_version}" in text, (
                      f"{readme}: current desktop preview is undocumented"
                  )
          print("version contract:", {"stable": stable_version, "desktop": desktop_version})
          PY
          if grep -RInE '\[Reading [0-9]+ lines from' harbor/desktop/src README*.md docs packaging; then
            echo "Tooling transcript text leaked into public sources" >&2
            exit 1
          fi

      - name: Validate tracked text integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          text_extensions = {
              ".cfg", ".conf", ".css", ".desktop", ".env", ".html", ".ini",
              ".js", ".json", ".json5", ".jsx", ".md", ".path", ".policy",
              ".py", ".rs", ".rst", ".scss", ".service", ".sh", ".svelte",
              ".svg", ".timer", ".toml", ".ts", ".tsx", ".txt", ".xml",
              ".yaml", ".yml",
          }
          text_names = {"Dockerfile", "LICENSE", "Makefile", "PKGBUILD", "README"}
          suspicious = {
              "Unicode replacement character": chr(0xFFFD),
              "HTML hex space entity": "&#x" + "20;",
              "HTML hex non-breaking-space entity": "&#x" + "A0;",
              "HTML decimal non-breaking-space entity": "&#" + "160;",
              "HTML non-breaking-space entity": "&" + "nbsp;",
              "UTF-8/cp1252 mojibake prefix": chr(0x00E2) + chr(0x20AC),
              "UTF-8/Latin-1 mojibake e-acute": chr(0x00C3) + chr(0x00A9),
              "UTF-8/Latin-1 mojibake e-grave": chr(0x00C3) + chr(0x00A8),
              "UTF-8/Latin-1 mojibake a-grave": chr(0x00C3) + chr(0x00A0),
              "UTF-8/Latin-1 mojibake c-cedilla": chr(0x00C3) + chr(0x00A7),
              "UTF-8/Latin-1 mojibake nbsp": chr(0x00C2) + chr(0x00A0),
          }

          failures = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", errors="surrogateescape"))
              if path.suffix.lower() not in text_extensions and path.name not in text_names:
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError as error:
                  failures.append(f"{path}: invalid UTF-8 ({error})")
                  continue
              for label, marker in suspicious.items():
                  if marker in text:
                      failures.append(f"{path}: {label}")

          if failures:
              raise SystemExit("\n".join(failures))
          print("tracked text integrity: OK")
          PY

      - name: Validate release security contract
        run: |
          python - <<"PY"
          from pathlib import Path
          import re

          errors = []
          for path in Path(".github/workflows").glob("*.yml"):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  match = re.search(r"^\s*-\s+uses:\s*([^\s]+)@([^\s#]+)", line)
                  if match and not re.fullmatch(r"[0-9a-f]{40}", match.group(2)):
                      errors.append(f"{path}:{number}: action is not pinned to a full SHA")

          policy = Path("packaging/polkit/io.github.GodsQuantum.BtrfsHarbor.policy").read_text()
          if "org.freedesktop.policykit.exec.allow_gui" in policy:
              errors.append("polkit policy must not forward GUI environment to the privileged helper")

          release = Path(".github/workflows/release.yml").read_text()
          workflow_header = release.split("jobs:", 1)[0]
          if "permissions:\n  contents: read\n" not in workflow_header or "contents: write" in workflow_header:
              errors.append("release workflow default token permissions must be read-only")
          linux_job = release.split("  linux-packages:\n", 1)[1].split("\n  publish-assets:\n", 1)[0]
          for permission in ("contents: read", "id-token: write", "attestations: write", "artifact-metadata: write"):
              if permission not in linux_job:
                  errors.append(f"linux-packages missing permission: {permission}")
          if "actions/attest@" not in linux_job:
              errors.append("release binaries must receive a build provenance attestation")
          publish_job = release.split("  publish-assets:\n", 1)[1]
          if "permissions:\n      contents: write\n" not in publish_job:
              errors.append("publish-assets must own the only contents:write grant")

          if errors:
              raise SystemExit("\n".join(errors))
          print("release security contract: OK")
          PY
