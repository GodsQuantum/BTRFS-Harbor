name: ReaR Real ISO Acceptance

on:
  push:
    branches: [preview/checkpoint-resume-v026]
    paths:
      - .github/workflows/rear-iso-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-rescue-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install official distro ReaR and UEFI ISO build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            rear xorriso grub-efi-amd64-bin isolinux syslinux-utils \
            btrfs-progs rsync zstd dosfstools qemu-system-x86 ovmf
          rear -V

      - name: Build exact Harbor Python engine and isolate rescue config
        run: |
          chmod +x packaging/build-engine-pyz.sh
          ./packaging/build-engine-pyz.sh
          sudo install -d -m 0755 /usr/lib/btrfs-harbor/recovery /usr/share/btrfs-harbor/rear
          sudo install -m 0755 packaging/rear/harbor-rear-restore \
            /usr/lib/btrfs-harbor/recovery/harbor-rear-restore
          sudo install -m 0644 packaging/generated/btrfs-backup-ng.pyz \
            /usr/lib/btrfs-harbor/btrfs-backup-ng.pyz
          sudo install -m 0644 packaging/rear/local.conf \
            /usr/share/btrfs-harbor/rear/local.conf
          test -r /usr/lib/btrfs-harbor/btrfs-backup-ng.pyz
          # CI-only serial output for headless QEMU/OVMF acceptance. The
          # default user packaging does not override anyone's console.
          sudo tee -a /usr/share/btrfs-harbor/rear/local.conf >/dev/null <<'EOF'
          USE_SERIAL_CONSOLE="yes"
          GRUB_FORCE_SERIAL="yes"
          SERIAL_CONSOLE_DEVICE_GRUB="serial --unit=0 --speed=115200"
          KERNEL_CMDLINE+=" console=ttyS0,115200n8"
          EOF

      - name: Build actual ReaR ISO on disposable GitHub VM
        run: |
          sudo rear -v -c /usr/share/btrfs-harbor/rear mkrescue 2>&1 | tee /tmp/harbor-rear-real-iso.log
          sudo find /var/lib/rear/output -name '*.iso' -type f -print
          iso="$(sudo find /var/lib/rear/output -type f -name '*.iso' | head -n1)"
          test -n "$iso"
          test "$(sudo stat -c '%s' "$iso")" -gt 65536
          sudo xorriso -indev "$iso" -report_el_torito plain | tee /tmp/harbor-rear-eltorito.txt
          grep -E 'El Torito boot img.*UEFI' /tmp/harbor-rear-eltorito.txt
          sudo sha256sum "$iso"
          echo "ISO physically built with UEFI entry; restored OS boot still untested."

      - name: Boot actual rescue ISO under isolated QEMU OVMF firmware
        timeout-minutes: 5
        run: |
          iso="$(sudo find /var/lib/rear/output -type f -name '*.iso' | head -n1)"
          # ReaR output is root-owned and private. Unprivileged QEMU uses a
          # private runner-owned COPY rather than modifying original ACLs.
          readable_iso="$RUNNER_TEMP/harbor-rear-boot-test.iso"
          sudo install -m 0600 -o "$(id -un)" -g "$(id -gn)"             "$iso" "$readable_iso"
          trap 'rm -f "$readable_iso"' EXIT
          # OVMF 4 MiB cannot be passed to legacy QEMU -bios (it errors
          # "could not load PC BIOS"). Select a MATCHED CODE/VARS pair and
          # use readonly pflash CODE + a disposable writable VARS copy.
          firmware=/usr/share/OVMF/OVMF_CODE_4M.fd
          variables=/usr/share/OVMF/OVMF_VARS_4M.fd
          if ! test -f "$firmware" || ! test -f "$variables"; then
            firmware=/usr/share/OVMF/OVMF_CODE.fd
            variables=/usr/share/OVMF/OVMF_VARS.fd
          fi
          test -r "$firmware" && test -r "$variables"
          vars_copy="$RUNNER_TEMP/harbor-rear-ovmf-vars.fd"
          cp -- "$variables" "$vars_copy"
          # Split 4M firmware is CODE (~3.5 MiB) + VARS (~0.5 MiB).
          # The individual files must NOT be equal in size; the pair's
          # combined pflash capacity must match its format.
          code_size="$(stat -c '%s' "$firmware")"
          vars_size="$(stat -c '%s' "$vars_copy")"
          case "$firmware" in
            *_4M.fd) test "$((code_size + vars_size))" -eq 4194304 ;;
            *) test "$((code_size + vars_size))" -eq 2097152 ;;
          esac
          trap 'rm -f "$readable_iso" "$vars_copy"' EXIT
          # NO writable disks or host device passthrough! TCG is used, not
          # /dev/kvm, so all guest hardware is a private software simulation.
          set +e
          timeout --signal=TERM --kill-after=10 170s             qemu-system-x86_64               -machine q35,accel=tcg -cpu max -smp 2 -m 2048               -drive "if=pflash,format=raw,readonly=on,file=$firmware"               -drive "if=pflash,format=raw,file=$vars_copy"               -cdrom "$readable_iso" -boot order=d               -display none -serial file:/tmp/rear-qemu-serial.log               -monitor none -no-reboot               >/tmp/rear-qemu-console.log 2>&1
          qemu_code=$?
          set -e
          echo "QEMU process exit: $qemu_code (timeout expected for interactive rescue)."
          tail -40 /tmp/rear-qemu-console.log || true
          tail -90 /tmp/rear-qemu-serial.log || true
          if ! grep -Eiq '(Linux version|Relax.and.Recover|Welcome to.*Linux|systemd.*starting|Starting kernel)'             /tmp/rear-qemu-serial.log; then
            echo "UEFI rescue boot was not proven from serial output" >&2
            exit 1
          fi
          echo "Rescue ISO reached a Linux boot stage under emulated OVMF (not a restored-OS boot)."

      - name: Preserve diagnostics for unsupported CI boot layouts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rear-iso-build-diagnostics
          path: |
            /tmp/harbor-rear-real-iso.log
            /tmp/harbor-rear-eltorito.txt
            /tmp/rear-qemu-serial.log
            /tmp/rear-qemu-console.log
          if-no-files-found: ignore
