name: Harbor Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  source-and-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build inherited engine wheel
        run: uv build --wheel --out-dir dist-python

      - name: Archive Harbor source
        run: |
          git archive --format=tar.gz --prefix=btrfs-harbor/             -o btrfs-harbor-source.tar.gz HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: btrfs-harbor-source-and-engine
          path: |
            btrfs-harbor-source.tar.gz
            dist-python/*.whl

  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Build and validate desktop frontend
        working-directory: harbor/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm check
          pnpm build

      - name: Build Linux release binaries
        working-directory: harbor
        run: |
          cargo build --release --locked             -p btrfs-harbor-desktop             -p harbor-agent             -p harborctl             -p harbor-recovery

      - uses: actions/upload-artifact@v7
        with:
          name: btrfs-harbor-linux-x86_64
          path: |
            harbor/target/release/btrfs-harbor-desktop
            harbor/target/release/harbor-agent
            harbor/target/release/btrfs-harborctl
            harbor/target/release/harbor-recovery

  publish-assets:
    needs: [source-and-engine, linux-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" release-assets/* --clobber

# Deliberately no PyPI publishing here.
# This fork preserves btrfs-backup-ng internally but must never publish a
# Harbor release under the upstream Python package name.
