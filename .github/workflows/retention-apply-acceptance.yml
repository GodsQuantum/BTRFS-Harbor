name: Real Btrfs Confirmed Retention and Recovery Acceptance

on:
  push:
    branches: [preview/checkpoint-resume-v026]
    paths:
      - .github/workflows/retention-apply-acceptance.yml
      - src/btrfs_backup_ng/core/machine_retention_gc_v2.py
      - src/btrfs_backup_ng/core/machine_retention_v2.py
      - src/btrfs_backup_ng/cli/machine_set_v2.py
      - src/btrfs_backup_ng/cli/checkpoint_v2_cmd.py
      - tests/integration/tier2/test_machine_set_v2_real.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-btrfs-retention:
    name: Disposable real Btrfs full/incremental/GC/fresh restore
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: quay.io/fedora/fedora:43
      options: --privileged
    steps:
      - name: Install Btrfs support in disposable container
        run: |
          dnf install -y btrfs-progs python3 python3-pip git kmod util-linux rsync zstd dosfstools
          modprobe btrfs || true
          test "$(id -u)" -eq 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Lock dependencies and run actual stream/retention/recover
        timeout-minutes: 20
        run: |
          uv sync --frozen --extra test --python python3
          uv run --frozen pytest -v -s \
            tests/integration/tier2/test_machine_set_v2_real.py \
            -m tier2 --tb=short --junitxml=/tmp/harbor-real-retention.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/harbor-real-retention.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          assert suite is not None
          assert int(suite.attrib["tests"]) >= 2
          assert int(suite.attrib.get("skipped", "0")) == 0
          assert int(suite.attrib.get("failures", "0")) == 0
          assert int(suite.attrib.get("errors", "0")) == 0
          print("REAL BTRFS: restored fresh after confirmed old-chain GC")
          PY
