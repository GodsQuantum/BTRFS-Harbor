name: UI Preview Temp

on:
  push:
    branches:
      - ui-preview-temp

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "12.9.1"

      - name: Build desktop frontend
        working-directory: harbor/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm check
          pnpm build

      - name: Install browser
        run: npx -y playwright@latest install --with-deps chromium

      - name: Capture default window
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory harbor/desktop/build >/tmp/harbor-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.5
          done
          npx -y playwright@latest screenshot \
            --browser=chromium \
            --viewport-size="1080,720" \
            --wait-for-timeout=1500 \
            http://127.0.0.1:4173 \
            overview-1080x720.png
          file overview-1080x720.png

      - uses: actions/upload-artifact@v7
        with:
          name: harbor-ui-preview
          path: overview-1080x720.png
