# Example Btrfs Harbor configuration.
# UUIDs are stable object identifiers; generate new ones for a real machine.

[[destinations]]
id = "22222222-2222-4222-8222-222222222222"
name = "Backup NAS"
kind = "nfs"
path = "/mnt/backup-nas/harbor/workstation"
mount_point = "/mnt/backup-nas"
expected_mount_source = "192.0.2.10:/backup-systems"
compression = "zstd"
optional = false

[[profiles]]
id = "11111111-1111-4111-8111-111111111111"
name = "Workstation recovery"
destination_ids = ["22222222-2222-4222-8222-222222222222"]
on_calendar = "*-*-* 02:00:00"
verify_after_backup = true

[profiles.retention]
hourly = 0
daily = 7
weekly = 4
monthly = 3
yearly = 0

[[profiles.sources]]
path = "/"
snapshot_prefix = "root-"
snapper_config = "root"
target_subdir = "rootfs"

[[profiles.sources]]
path = "/home"
snapshot_prefix = "home-"
target_subdir = "home"

[[profiles.sources]]
path = "/root"
snapshot_prefix = "root-home-"
target_subdir = "root-home"

[[profiles.sources]]
path = "/srv"
snapshot_prefix = "srv-"
target_subdir = "srv"
