[workspace]
resolver = "3"
members = [
  "crates/harbor-core",
  "crates/harbor-engine",
  "crates/harbor-storage",
  "crates/harbor-replica",
  "crates/harbor-agent",
  "crates/harbor-recovery",
  "desktop/src-tauri", "crates/harborctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/GodsQuantum/btrfs-harbor"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v4"] }
zbus = { version = "5.12", features = ["tokio"] }
