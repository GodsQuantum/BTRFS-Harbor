[package]
name = "btrfs-harbor-desktop"
version = "0.2.6-rc.5"
description = "Native Btrfs Harbor backup, recovery and replication desktop"
authors = ["Btrfs Harbor contributors"]
license = "MIT"
repository = "https://github.com/GodsQuantum/btrfs-harbor"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "btrfs-harbor"
path = "src/main.rs"

[lib]
name = "btrfs_harbor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
harbor-agent = { path = "../../crates/harbor-agent" }
harbor-core = { path = "../../crates/harbor-core" }
harbor-engine = { path = "../../crates/harbor-engine" }
harbor-storage = { path = "../../crates/harbor-storage" }
log = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-log = "2"
tokio = { version = "1.53", features = ["io-util", "macros", "process", "time"] }
uuid = "1.27"
zbus = { version = "5.19", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
