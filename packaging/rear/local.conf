# BTRFS Harbor ReaR 2.9 — static EXTERNAL hook, no shell injection.
# Only used from an isolated rescue ISO made on the original machine.
OUTPUT=ISO
BACKUP=EXTERNAL
EXTERNAL_BACKUP='true'
EXTERNAL_RESTORE='/usr/lib/btrfs-harbor/recovery/harbor-rear-restore'
COPY_AS_IS+=(
  /usr/lib/btrfs-harbor/recovery/harbor-rear-restore
  /usr/lib/btrfs-harbor/btrfs-backup-ng.pyz
  /usr/lib/btrfs-harbor/
)
# Only the universal .run installs its own optional standalone Python tree.
if [[ -d /opt/btrfs-harbor/python ]]; then
  COPY_AS_IS+=( /opt/btrfs-harbor/python )
fi
# ReaR 2.9's ELF scanner on some systemd versions misses systemd's
# dynamically opened libsystemd-shared-*.so. An actual Ubuntu 24.04
# mkrescue warning identified this. Include only detected systemd shared
# library directories, using their installed distro-specific paths.
for rear_systemd_lib_dir in /usr/lib/*-linux-gnu/systemd /usr/lib/systemd; do
  if [[ -d "$rear_systemd_lib_dir" ]]; then
    COPY_AS_IS+=( "$rear_systemd_lib_dir" )
  fi
done
REQUIRED_PROGS+=( btrfs findmnt mountpoint blkid rsync tar zstd bash python3 )
